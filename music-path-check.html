<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YURI1 Music · 路徑檢查</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#101015;color:#f1eef5;font:15px/1.55 system-ui,-apple-system,sans-serif;margin:0;padding:24px}main{max-width:1120px;margin:auto}a{color:#f69ac0}h1{font-size:22px;margin-top:0}.muted{color:#aaa3af}button{background:#ee639e;color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:18px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #302a36;overflow-wrap:anywhere}th{color:#aca2ad}.ok{color:#94dbb1}.bad{color:#ff96a1}.other{color:#eacc82}code{font-size:12px}.small{font-size:12px}@media(max-width:650px){body{padding:12px}table{font-size:11px}th,td{padding:6px 3px}}
</style></head><body><main><h1>YURI1 Music · 路徑檢查</h1>
<p>直接向<strong>目前開啟這一頁的網站</strong>檢查歌曲的圖片、MP3、歌詞是否存在。只發出 <code>HEAD</code> 請求，<strong>不下載 MP3 內容</strong>。若本機沒有複製媒體資料夾，結果會顯示 404，不代表正式站也缺檔。</p>
<p class="muted">目前位置：<code id="base"></code>。網址的大小寫與空格會原樣檢查。</p>
<button id="scan">開始檢查 22 首歌曲</button> <span id="progress" class="muted"></span>
<div style="overflow-x:auto"><table><thead><tr><th>歌曲</th><th>檔案</th><th>HTTP</th><th>檔案路徑（可開啟）</th></tr></thead><tbody id="results"></tbody></table></div>
</main><script>
(async()=>{
 const base=document.querySelector('#base'),btn=document.querySelector('#scan'),out=document.querySelector('#results'),progress=document.querySelector('#progress');
 base.textContent=location.origin+'/';
 const fmt=t=>encodeURIComponent(String(t.ID))+'%20('+t.Img+')';
 const requests=t=>[['封面','music-img/'+fmt(t)+'.jpg'],['MP3','music-mp3/'+fmt(t)+'.mp3'],['歌詞','music-text/'+fmt(t)+'.txt']];
 async function test(path){try{const r=await fetch(new URL(path,location.origin+'/'),{method:'HEAD',cache:'no-store'});let state='';if(r.ok){const type=r.headers.get('content-type')||'';if(/text\/html/i.test(type)){return {label:'HTML 回應（非媒體檔）',status:false}}return{label:'HTTP '+r.status,status:true}}return{label:'HTTP '+r.status,status:false}}catch(e){return{label:'網路／CORS 失敗',status:null}}}
 btn.addEventListener('click',async()=>{
  btn.disabled=true;out.replaceChildren();progress.textContent='讀取歌曲清單…';
  try{const r=await fetch('w-music/w-tracklog.json',{cache:'no-store'});if(!r.ok)throw Error('歌曲清單 HTTP '+r.status);const j=await r.json(),tracks=Array.isArray(j)?j:j.tracks;if(!Array.isArray(tracks))throw Error('無歌曲資料');let total=tracks.length*3,done=0,failed=0;progress.textContent=`檢查 0 / ${total}`;
   for(const t of tracks){for(const [kind,path] of requests(t)){const result=await test(path);const tr=document.createElement('tr');let first=document.createElement('td');first.textContent=t.TITLE;tr.appendChild(first);let kindCell=document.createElement('td');kindCell.textContent=kind;tr.appendChild(kindCell);let state=document.createElement('td');state.className=result.status===true?'ok':result.status===false?'bad':'other';state.textContent=result.label;tr.appendChild(state);let td=document.createElement('td'),link=document.createElement('a');link.href=new URL(path,location.origin+'/').href;link.target='_blank';link.rel='noopener';link.textContent=decodeURIComponent(path);td.appendChild(link);tr.appendChild(td);out.appendChild(tr);done++;if(result.status!==true)failed++;progress.textContent=`檢查 ${done} / ${total} · 異常／無法確認 ${failed}`;}}
  }catch(e){progress.textContent='檢查失敗：'+e.message;}finally{btn.disabled=false;}
 });
})();
</script></body></html>
